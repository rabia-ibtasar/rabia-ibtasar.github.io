role: Learning Sciences & Computing Education Researcher

bio: |
  I study how the design of technologies and the social environments surrounding their use shape learning, interest, and participation. My work brings together learning sciences, human–computer interaction, computing education, and social robotics.

  I completed my Ph.D. in Learning Sciences at the University of Illinois Chicago in May 2026, advised by Dr. Joseph E. Michaelis. I also hold a master’s degree in Computer and Information Science from the University of Pennsylvania and a Bachelor of Science in Computer Science from Lahore University of Management Sciences.

  My dissertation, “Broadening Participation of Girls in Computing: An Integrated Approach to Supporting Interest in CS,” examined how technological and social scaffolds support girls’ interest in computing. Through the MyTurn project, I designed a web-based pre-coding tool and studied its use alongside peer collaboration and mentorship during social robotics activities.

  My broader research includes in-home robot learning companions and teacher-facing tools for designing robot-assisted learning experiences. I use iterative design and mixed methods—including interviews, observations, surveys, interaction analysis, and artifact analysis—to understand learners’ experiences and inform technology design.

  Looking ahead, I ask: How can AI-enabled tools and social scaffolds be coordinated to support learning, learner agency, and interest over time?

